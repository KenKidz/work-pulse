<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WorkPulse — redesign wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --radius: 0.375rem;
    --background: #f4f7fb;
    --foreground: #172b4d;
    --card: #ffffff;
    --card-foreground: #172b4d;
    --popover: #ffffff;
    --popover-foreground: #172b4d;
    --primary: #2563eb;
    --primary-foreground: #ffffff;
    --secondary: #e8eef8;
    --secondary-foreground: #243b60;
    --muted: #e9eff8;
    --muted-foreground: #52627a;
    --accent: #dce8fb;
    --accent-foreground: #172b4d;
    --destructive: #b42318;
    --destructive-foreground: #ffffff;
    --success: #157a53;
    --success-foreground: #ffffff;
    --warning: #945200;
    --warning-foreground: #ffffff;
    --info: #1d4ed8;
    --info-foreground: #ffffff;
    --border: #d9e2ef;
    --input: #8796ac;
    --ring: #2563eb;
    --sidebar: #edf2f9;
    --sidebar-foreground: #172b4d;
    --sidebar-accent: #dce8fb;
    --sidebar-border: #d9e2ef;
    --canvas: #e7edf6;
    --shadow-pop: 0 10px 30px rgba(23, 43, 77, 0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Fira Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
    background: var(--canvas);
    color: var(--foreground);
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  svg {
    display: block; fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .mono { font-family: "Fira Code", ui-monospace, SFMono-Regular, monospace; }
  .tabular { font-variant-numeric: tabular-nums; }

  /* ---------- wireframe toolbar ---------- */
  .toolbar {
    position: sticky; top: 0; z-index: 100;
    background: #fff; border-bottom: 1px solid var(--border);
    padding: 10px 16px;
  }
  .toolbar-inner {
    max-width: 1560px; margin: 0 auto;
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
  }
  .brand { display: flex; align-items: center; gap: 8px; margin-right: 8px; }
  .brand-mark {
    width: 24px; height: 24px; border-radius: 6px; background: var(--primary);
    color: #fff; display: grid; place-items: center;
  }
  .brand-mark svg { width: 14px; height: 14px; }
  .brand-name { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
  .brand-sub { font-size: 12px; color: var(--muted-foreground); }
  .control { display: flex; align-items: center; gap: 6px; }
  .control-label { font-size: 12px; font-weight: 500; color: var(--muted-foreground); }
  select.tool-select {
    height: 32px; border: 1px solid var(--border); background: #fff;
    border-radius: 6px; padding: 0 8px; font-size: 12px; color: var(--foreground);
  }
  .seg {
    display: inline-flex; align-items: center; gap: 2px; padding: 2px;
    background: var(--muted); border-radius: 6px;
  }
  .seg button {
    min-width: 32px; height: 32px; padding: 0 9px; border: 0; border-radius: 4px;
    background: transparent; color: var(--muted-foreground); font-size: 12px; font-weight: 600;
  }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--foreground); box-shadow: 0 1px 2px rgba(23,43,77,.08); }
  .toggle {
    display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 9px;
    border: 1px solid var(--border); border-radius: 6px; background: #fff; font-size: 12px;
    color: var(--muted-foreground);
  }
  .toggle[aria-pressed="true"] { border-color: var(--primary); color: var(--primary); background: #edf4ff; }
  .toolbar .spacer { flex: 1 1 auto; }
  .toolbar-note { font-size: 12px; color: var(--muted-foreground); }

  /* ---------- stage ---------- */
  .stage-wrap { padding: 18px 0 0; overflow-x: auto; }
  .stage {
    width: 1440px; min-height: 1000px; margin: 0 auto;
    background: var(--background); border: 1px solid var(--border);
    box-shadow: 0 1px 2px rgba(23,43,77,.04);
    display: flex; align-items: stretch;
    position: relative;
  }
  .stage.mobile { width: 375px; min-height: 812px; }
  .stage.grayscale { filter: grayscale(1); }
  .stage.compact .desc,
  .stage.compact .hint,
  .stage.compact .repeat { display: none !important; }
  .stage.no-repeat .repeat { display: none !important; }

  /* ---------- sidebar ---------- */
  .sidebar {
    width: 240px; flex: 0 0 240px; background: var(--sidebar);
    border-right: 1px solid var(--sidebar-border);
    display: flex; flex-direction: column;
  }
  .sidebar-brand {
    height: 64px; flex: 0 0 64px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 9px; padding: 0 16px;
  }
  .sidebar-brand .brand-mark { width: 22px; height: 22px; border-radius: 6px; }
  .sidebar-brand .name { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
  .sidebar-nav { padding: 12px 8px; display: flex; flex-direction: column; gap: 14px; }
  .nav-group-label {
    font-size: 12px; font-weight: 500; color: var(--muted-foreground);
    padding: 0 8px 5px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 9px; height: 34px; padding: 0 8px;
    border-radius: 5px; color: var(--sidebar-foreground); text-decoration: none;
    font-size: 13px; line-height: 1;
  }
  .nav-item + .nav-item { margin-top: 4px; }
  .nav-item svg { width: 16px; height: 16px; color: var(--muted-foreground); }
  .nav-item.active { background: var(--sidebar-accent); font-weight: 600; }
  .nav-item.active svg { color: var(--primary); }
  .nav-item .count {
    margin-left: auto; font-size: 12px; font-weight: 600; color: var(--primary);
    background: #fff; border: 1px solid var(--border); border-radius: 999px; padding: 2px 6px;
  }
  .sidebar-foot { margin-top: auto; padding: 12px; }

  /* ---------- header + main ---------- */
  .main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  .app-header {
    height: 64px; flex: 0 0 64px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; padding: 0 22px;
    background: var(--background);
  }
  .icon-btn {
    width: 34px; height: 34px; display: grid; place-items: center;
    border: 0; border-radius: 5px; background: transparent; color: var(--muted-foreground);
  }
  .icon-btn:hover { background: var(--muted); color: var(--foreground); }
  .icon-btn svg { width: 17px; height: 17px; }
  .header-search {
    margin-left: auto; display: flex; align-items: center; gap: 8px;
    height: 34px; width: 220px; border: 1px solid var(--border); border-radius: 5px;
    padding: 0 10px; color: var(--muted-foreground); background: transparent;
    font-size: 12px;
  }
  .header-search svg { width: 14px; height: 14px; flex: 0 0 auto; }
  .header-search kbd {
    margin-left: auto; font-family: inherit; font-size: 12px; border: 1px solid var(--border);
    border-radius: 3px; padding: 1px 4px; color: var(--muted-foreground);
  }
  .header-actions { display: flex; align-items: center; gap: 2px; }
  .avatar {
    width: 28px; height: 28px; border-radius: 999px; background: var(--secondary);
    color: var(--secondary-foreground); display: inline-grid; place-items: center;
    font-size: 12px; font-weight: 600; letter-spacing: .02em; flex: 0 0 auto;
  }
  .avatar.sm { width: 30px; height: 30px; font-size: 12px; }
  .avatar.lg { width: 36px; height: 36px; font-size: 12px; }
  .mobile-brand { display: none; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; }
  .mobile-brand svg { width: 17px; height: 17px; color: var(--primary); }

  .content {
    width: 100%; max-width: 1280px; margin: 0 auto;
    padding: 26px 32px 48px; display: flex; flex-direction: column; gap: 20px;
  }
  .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .page-title { margin: 0; font-size: 30px; line-height: 36px; letter-spacing: -0.025em; font-weight: 600; }
  .page-desc { margin: 6px 0 0; font-size: 13px; line-height: 19px; color: var(--muted-foreground); max-width: 660px; }
  .page-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; padding-top: 2px; }
  .live-inline { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--success); font-weight: 500; }
  .pulse { width: 7px; height: 7px; border-radius: 999px; background: var(--success); position: relative; }
  .pulse::after {
    content: ""; position: absolute; inset: 0; border-radius: 999px;
    background: var(--success); opacity: .35; transform: scale(2.1);
  }

  /* ---------- controls ---------- */
  .btn {
    height: 34px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 1px solid transparent; border-radius: 5px; padding: 0 13px;
    font-size: 12px; font-weight: 500; white-space: nowrap; text-decoration: none;
  }
  .btn svg { width: 14px; height: 14px; }
  .btn-primary { background: var(--primary); color: var(--primary-foreground); }
  .btn-outline { background: #fff; border-color: var(--border); color: var(--foreground); }
  .btn-ghost { background: transparent; color: var(--muted-foreground); }
  .btn-ghost:hover { background: var(--muted); color: var(--foreground); }
  .btn-sm { height: 28px; padding: 0 9px; font-size: 12px; }
  .btn-sm svg { width: 12px; height: 12px; }
  .btn-block { width: 100%; }
  .link {
    color: var(--primary); text-decoration: none; font-size: 12px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 4px; min-height: 32px;
  }
  .link svg { width: 12px; height: 12px; }
  .input {
    height: 34px; width: 100%; border: 1px solid var(--input); border-radius: 5px;
    background: #fff; padding: 0 10px; font-size: 12px; color: var(--foreground);
    outline: none;
  }
  .input::placeholder { color: var(--muted-foreground); }
  .input:focus { border-color: var(--ring); box-shadow: 0 0 0 3px rgba(37,99,235,.16); }
  .input-icon { position: relative; }
  .input-icon svg { position: absolute; left: 9px; top: 50%; width: 14px; height: 14px; transform: translateY(-50%); color: var(--muted-foreground); }
  .input-icon .input { padding-left: 30px; }
  .select {
    height: 34px; border: 1px solid var(--input); border-radius: 5px; background: #fff;
    padding: 0 28px 0 10px; font-size: 12px; color: var(--foreground); appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%), linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
    background-position: calc(100% - 13px) 14px, calc(100% - 9px) 14px;
    background-size: 4px 4px, 4px 4px; background-repeat: no-repeat;
  }
  .seg-control { display: inline-flex; gap: 2px; padding: 3px; background: var(--muted); border-radius: 6px; }
  .seg-control button {
    height: 28px; padding: 0 11px; border: 0; border-radius: 4px; background: transparent;
    font-size: 12px; font-weight: 500; color: var(--muted-foreground);
  }
  .seg-control button[aria-pressed="true"] { background: #fff; color: var(--foreground); box-shadow: 0 1px 2px rgba(23,43,77,.08); }

  /* ---------- cards + blocks ---------- */
  .block { position: relative; }
  .bnum {
    position: absolute; top: -9px; left: 12px; z-index: 3;
    background: #fff; border: 1px solid var(--border); border-radius: 999px;
    padding: 2px 6px; font-family: "Fira Code", monospace; font-size: 9px; line-height: 12px;
    font-weight: 500; color: var(--muted-foreground);
  }
  .hide-numbers .bnum { display: none; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 6px;
    overflow: hidden;
  }
  .card-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 16px 10px;
  }
  .card-title { margin: 0; font-size: 14px; line-height: 18px; font-weight: 600; letter-spacing: -0.01em; }
  .card-desc { margin: 3px 0 0; font-size: 12px; line-height: 16px; color: var(--muted-foreground); }
  .card-body { padding: 0 16px 16px; }
  .card-foot {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    border-top: 1px solid var(--border); padding: 9px 16px; font-size: 12px; color: var(--muted-foreground);
  }
  .divider { height: 1px; background: var(--border); }

  /* ---------- KPI strip ---------- */
  .kpi-strip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .kpi { padding: 14px 16px 13px; border-left: 1px solid var(--border); min-width: 0; }
  .kpi:first-child { border-left: 0; }
  .kpi-label { font-size: 12px; line-height: 14px; font-weight: 500; color: var(--muted-foreground); }
  .kpi-value { margin-top: 5px; font-size: 29px; line-height: 30px; font-weight: 600; letter-spacing: -0.04em; }
  .kpi-value.warn { color: var(--warning); }
  .kpi-value.bad { color: var(--destructive); }
  .kpi-value.muted { color: var(--muted-foreground); }
  .kpi-hint { margin-top: 4px; font-size: 12px; line-height: 13px; color: var(--muted-foreground); }
  .strip-note {
    border-top: 1px solid var(--border); padding: 8px 16px;
    font-size: 12px; line-height: 15px; color: var(--muted-foreground);
  }

  /* ---------- approvals ---------- */
  .queue-tabs { display: flex; align-items: center; gap: 2px; border-bottom: 1px solid var(--border); padding: 0 12px; }
  .queue-tab {
    height: 36px; padding: 0 10px; border: 0; background: transparent; font-size: 12px;
    font-weight: 500; color: var(--muted-foreground); border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .queue-tab[aria-pressed="true"] { color: var(--foreground); border-bottom-color: var(--primary); font-weight: 600; }
  .queue-tab .n { margin-left: 5px; font-size: 12px; color: var(--muted-foreground); }
  .approval-row {
    display: flex; align-items: center; gap: 11px; padding: 11px 16px;
    border-bottom: 1px solid var(--border); min-width: 0;
  }
  .approval-row:last-child { border-bottom: 0; }
  .approval-main { min-width: 0; flex: 1 1 auto; }
  .approval-top { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .approval-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .approval-meta { margin-top: 2px; font-size: 12px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .approval-actions { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }

  /* ---------- badges ---------- */
  .badge {
    display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px;
    border-radius: 4px; font-size: 12px; line-height: 1; font-weight: 600; white-space: nowrap;
    border: 1px solid transparent;
  }
  .badge svg { width: 10px; height: 10px; }
  .badge-success { background: rgba(21,122,83,.10); color: var(--success); }
  .badge-warning { background: rgba(148,82,0,.13); color: var(--warning); }
  .badge-danger { background: rgba(180,35,24,.10); color: var(--destructive); }
  .badge-muted { background: var(--muted); color: var(--muted-foreground); }
  .badge-info { background: rgba(29,78,216,.10); color: var(--info); }
  .badge-outline { border-color: var(--border); color: var(--muted-foreground); background: #fff; }

  /* ---------- my day ---------- */
  .myday-status { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 500; color: var(--success); }
  .myday-time { display: flex; align-items: baseline; gap: 8px; margin-top: 9px; }
  .myday-time strong { font-size: 28px; line-height: 28px; font-weight: 600; letter-spacing: -0.03em; }
  .myday-time span { font-size: 12px; color: var(--muted-foreground); }
  .balance-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .balance { border: 1px solid var(--border); border-radius: 5px; padding: 9px 10px; }
  .balance-label { font-size: 12px; color: var(--muted-foreground); }
  .balance-value { margin-top: 3px; font-size: 14px; font-weight: 600; }
  .balance-value span { font-size: 12px; font-weight: 400; color: var(--muted-foreground); }
  .mini-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; }
  .mini-row .muted { color: var(--muted-foreground); }

  /* ---------- activity ---------- */
  .activity { display: flex; flex-direction: column; }
  .activity-row { display: flex; gap: 10px; padding: 8px 16px; border-bottom: 1px solid var(--border); }
  .activity-row:last-child { border-bottom: 0; }
  .activity-time { flex: 0 0 42px; font-family: "Fira Code", monospace; font-size: 12px; line-height: 15px; color: var(--muted-foreground); padding-top: 1px; }
  .activity-dot { flex: 0 0 7px; width: 7px; height: 7px; border-radius: 999px; background: var(--primary); margin-top: 4px; }
  .activity-dot.success { background: var(--success); }
  .activity-dot.warn { background: var(--warning); }
  .activity-dot.muted { background: var(--input); }
  .activity-copy { min-width: 0; font-size: 12px; line-height: 16px; }
  .activity-copy strong { font-weight: 600; }
  .activity-copy .meta { display: block; font-size: 12px; color: var(--muted-foreground); margin-top: 1px; }

  /* ---------- presence ---------- */
  .presence-list { display: flex; flex-direction: column; }
  .presence-row { display: flex; align-items: center; gap: 9px; padding: 8px 16px; border-bottom: 1px solid var(--border); }
  .presence-row:last-child { border-bottom: 0; }
  .presence-name { min-width: 0; flex: 1 1 auto; }
  .presence-name strong { display: block; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .presence-name span { display: block; font-size: 12px; color: var(--muted-foreground); }
  .presence-since { font-family: "Fira Code", monospace; font-size: 12px; color: var(--muted-foreground); }

  /* ---------- tables ---------- */
  .table-scroll { width: 100%; overflow-x: auto; }
  .table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .table th {
    height: 36px; padding: 0 10px; text-align: left; font-size: 12px; font-weight: 500;
    color: var(--muted-foreground); border-bottom: 1px solid var(--border); white-space: nowrap;
    background: var(--card); position: sticky; top: 0; z-index: 1;
  }
  .table td { height: 44px; padding: 6px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .table tr:last-child td { border-bottom: 0; }
  .table tbody tr:hover { background: rgba(233,239,248,.5); }
  .cell-person { display: flex; align-items: center; gap: 8px; }
  .cell-person .who { min-width: 0; }
  .cell-person .who strong { display: block; font-size: 12px; font-weight: 600; }
  .cell-person .who span { display: block; font-size: 12px; color: var(--muted-foreground); font-family: "Fira Code", monospace; }
  .muted { color: var(--muted-foreground); }
  .table-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid var(--border); padding: 9px 12px; font-size: 12px; color: var(--muted-foreground); }
  .pager { display: flex; align-items: center; gap: 6px; }
  .pager .btn { height: 27px; }
  .table-hint { display: none; font-size: 12px; color: var(--muted-foreground); padding: 0 2px 6px; }

  /* ---------- form / check-in ---------- */
  .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .field-label { font-size: 12px; font-weight: 500; color: var(--muted-foreground); }
  .checkin-form { display: grid; grid-template-columns: 190px minmax(0,1fr) auto; gap: 10px; align-items: end; }
  .checkin-form .textarea {
    height: 62px; width: 100%; border: 1px solid var(--input); border-radius: 5px; background: #fff;
    padding: 8px 10px; font-size: 12px; resize: none;
  }
  .open-record {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    border: 1px solid rgba(21,122,83,.3); background: rgba(21,122,83,.05);
    border-radius: 5px; padding: 10px 12px;
  }
  .open-record .left { display: flex; align-items: center; gap: 9px; }
  .open-icon { width: 30px; height: 30px; border-radius: 5px; background: rgba(21,122,83,.1); color: var(--success); display: grid; place-items: center; }
  .open-icon svg { width: 14px; height: 14px; }
  .open-record strong { display: block; font-size: 12px; font-weight: 600; }
  .open-record span { display: block; font-size: 12px; color: var(--muted-foreground); }

  /* ---------- filters ---------- */
  .filter-bar { display: grid; grid-template-columns: minmax(190px, 1.4fr) repeat(5, minmax(120px, .8fr)) auto; gap: 8px; align-items: center; }
  .filter-bar.compact-bar { grid-template-columns: minmax(190px, 1.4fr) repeat(3, minmax(120px, .8fr)) auto; }
  .filter-actions { display: flex; align-items: center; gap: 6px; }

  /* ---------- empty / error / loading ---------- */
  .empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;
    border: 1px dashed var(--border); border-radius: 6px; padding: 28px 16px; text-align: center;
  }
  .empty svg { width: 20px; height: 20px; color: var(--muted-foreground); }
  .empty p { margin: 0; font-size: 12px; line-height: 16px; color: var(--muted-foreground); max-width: 320px; }
  .empty .btn { margin-top: 3px; }
  .alert {
    display: flex; gap: 9px; border: 1px solid rgba(180,35,24,.28);
    background: rgba(180,35,24,.05); border-radius: 5px; padding: 11px 12px;
  }
  .alert svg { width: 16px; height: 16px; color: var(--destructive); flex: 0 0 auto; margin-top: 1px; }

  if (state.width === "mobile") classes.push("mobile");
  if (state.compact) classes.push("compact");
  if (state.noRepeat) classes.push("no-repeat");
  if (state.grayscale) classes.push("grayscale");
  if (!state.numbers) classes.push("hide-numbers");

  let inner = "";
  if (state.screen === "login") {
    inner = loginA().replace('class="auth-stage"', 'class="auth-stage' + (state.width === "mobile" ? " mobile" : "") + '"');
  } else {
    const active = state.screen === "employee" ? "dashboard" : state.screen;
    let body;
    if (state.screen === "dashboard") body = state.option === "A" ? dashboardA() : state.option === "B" ? dashboardB() : dashboardC();
    else if (state.screen === "employee") body = employeeDashboard();
    else if (state.screen === "attendance") body = state.option === "A" ? attendanceA() : attendanceB();
    else if (state.screen === "employees") body = state.option === "A" ? employeesA() : employeesB();
    else body = commandCenter();
    inner = sidebar(active) + body;
  }

  const wrapperClass = state.screen === "login" ? "stage-wrap" : "stage-wrap";
  stage.innerHTML = '<div class="' + classes.join(" ") + '" id="stage">' + inner + "</div>";

  // option buttons
  const optionBox = document.getElementById("options");
  optionBox.innerHTML = opts.map(function (o) {
    return '<button type="button" data-option="' + o.id + '" aria-pressed="' + (state.option === o.id) + '">' + o.label + "</button>";
  }).join("");

  // reason panel
  const reason = REASONS[state.screen][state.option];
  const screenNames = {
    dashboard: "Dashboard — manager",
    employee: "Dashboard — employee",
    attendance: "Attendance",
    employees: "Employees",
    command: "Command center",
    login: "Sign in",
  };
  document.getElementById("reason").innerHTML =
    "<div><h2>Why this option</h2><div class=\"chosen\">" + screenNames[state.screen] + " · Option " + state.option + '</div><div class="pick">' + (state.option === "A" ? "Recommended" : "Alternative") + "</div></div>" +
    '<div class="reason-col"><h3>Strong</h3><p>' + reason.strengths + "</p></div>" +
    '<div class="reason-col"><h3>Weak</h3><p>' + reason.weaknesses + "</p></div>" +
    '<div class="reason-col"><h3>Fits</h3><p>' + reason.fits + "</p></div>";
}

document.getElementById("screen").addEventListener("change", function (e) {
  state.screen = e.target.value;
  state.option = OPTIONS[state.screen][0].id;
  render();
});

document.getElementById("options").addEventListener("click", function (e) {
  const btn = e.target.closest("button[data-option]");
  if (!btn) return;
  state.option = btn.getAttribute("data-option");
  render();
});

document.getElementById("width").addEventListener("click", function (e) {
  const btn = e.target.closest("button[data-width]");
  if (!btn) return;
  state.width = btn.getAttribute("data-width");
  Array.from(document.querySelectorAll("#width button")).forEach(function (b) {
    b.setAttribute("aria-pressed", String(b === btn));
  });
  render();
});

document.getElementById("compact").addEventListener("click", function (e) {
  state.compact = !state.compact;
  e.currentTarget.setAttribute("aria-pressed", String(state.compact));
  render();
});

document.getElementById("no-repeat").addEventListener("click", function (e) {
  state.noRepeat = !state.noRepeat;
  e.currentTarget.setAttribute("aria-pressed", String(state.noRepeat));
  render();
});

document.getElementById("numbers").addEventListener("click", function (e) {
  state.numbers = !state.numbers;
  e.currentTarget.setAttribute("aria-pressed", String(state.numbers));
  render();
});

document.getElementById("grayscale").addEventListener("click", function (e) {
  state.grayscale = !state.grayscale;
  e.currentTarget.setAttribute("aria-pressed", String(state.grayscale));
  render();
});

document.getElementById("data-state").addEventListener("change", function (e) {
  state.dataState = e.target.value;
  render();
});

render();
</script>
</body>
</html>
