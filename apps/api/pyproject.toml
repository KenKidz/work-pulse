[project]
name = "workpulse-api"
version = "0.1.0"
description = "WorkPulse API — FastAPI modular monolith"
requires-python = ">=3.12"
dependencies = [
    # Phase 3, outbox relay (ADR 0006's pre-agreed gate; justified by
    # `.ai/features/outbox-relay.md`): the worker publishes to Kafka.
    "aiokafka>=0.12",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    # Phase 4+, employee documents (ADR 0022): the S3-compatible client behind
    # the `DocumentStorage` port (presigned POST/GET against private MinIO).
    "boto3>=1.43.119",
    # Phase 4, Analytics & Reports (ADR 0006's pre-agreed gate; justified by
    # `.ai/features/analytics-reports.md` / ADR 0019): ClickHouse HTTP client.
    "clickhouse-connect>=1.11.0",
    # `Depends(..., scope="function")` commits the request session before the
    # response (ADR 0025); 0.121.1 fixes it for parameterless dependencies.
    "fastapi>=0.121.1",
    # Phase 6, observability (ADR 0006's pre-agreed gate; justified by
    # `.ai/features/observability.md` / ADR 0023): tracing, metric collection
    # and Prometheus exposition. Workers run in this same environment.
    "opentelemetry-api>=1.39.0",
    "opentelemetry-exporter-otlp-proto-http>=1.39.0",
    "opentelemetry-exporter-prometheus>=0.60b1",
    "opentelemetry-sdk>=1.39.0",
    "pydantic-settings>=2.6.0",
    "prometheus-client>=0.24.0",
    "redis>=8.1.0",
    "resend>=2.50.0",
    "slack-sdk>=3.45.0",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=26.1.0",
    "uuid-utils>=1.0.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "jsonschema>=4.26.0",
    "pyright>=1.1.414",
    "pytest>=8.3.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.uv]
# The API is an application, not a distributable package: uv manages the venv
# and dependencies without installing the project itself.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# The second entry is the repo root (from apps/api), where `workers/` lives:
# relay tests import `workers.relay.*` (ADR 0012 — the workers run inside the
# apps/api environment).
pythonpath = [".", "../.."]
addopts = "-q"
asyncio_mode = "auto"
# One session-wide event loop: the global async engine/pool must live in the
# same loop as every test that uses it.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
# The API is `app`; the workers under the repo root are the same first party
# (they run in this environment — ADR 0012 decision 10).
known-first-party = ["app", "workers"]

[tool.pyright]
typeCheckingMode = "standard"
include = ["app", "tests", "alembic", "scripts"]
# The repo root, so tests resolve `workers.relay.*` (outside this project's
# root but inside the same uv environment — ADR 0012 decision 10).
extraPaths = ["../.."]
venvPath = "."
venv = ".venv"
