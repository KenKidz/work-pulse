name: CI

# Full gate battery on every PR and main push (deployment T7, ADR 0026).
#
# The four gates from `.ai/testing.md` run on every change; a gate that is
# skipped because another one failed would protect nothing, so none is
# conditional. Only a fully green run on `main` builds and pushes the two
# images: `build-push` is `needs`-gated on all four jobs, so a red gate leaves
# the registry untouched.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; a main push always runs to completion
  # (it owns the image push).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Docker Compose substitutes these into the dev PostgreSQL service. The
  # values mirror the tracked dev-only credentials in `.env.example`; CI uses
  # no deployed-environment secret.
  POSTGRES_USER: workpulse
  POSTGRES_PASSWORD: workpulse
  POSTGRES_DB: workpulse
  # The compose dev database publishes :5434 (the Settings default :5432 is
  # the pre-drift value). Integration tests pin DATABASE_TEST_URL themselves.
  DATABASE_URL: postgresql+asyncpg://workpulse:workpulse@localhost:5434/workpulse
  # A gate must fail on a stale lockfile instead of silently resolving new
  # dependencies mid-run.
  UV_FROZEN: "1"

jobs:
  check-api:
    name: check-api
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.24"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install API dependencies
        run: uv sync --frozen
        working-directory: apps/api
      - name: Run API gate (ruff + pyright + pytest)
        run: make check-api

  check-web:
    name: check-web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: Run web gate (typecheck + ESLint + Vitest)
        run: make check-web

  check-e2e:
    name: check-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.24"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install API dependencies
        run: uv sync --frozen
        working-directory: apps/api
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E gate (Playwright across the full event hop)
        run: make check-e2e

  check-load:
    name: check-load
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.24"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install API dependencies
        run: uv sync --frozen
        working-directory: apps/api
      - name: Install k6
        uses: grafana/setup-k6-action@v1
        with:
          # Pinned: the gate is code, and a floating load generator would make
          # the SLO non-reproducible. `run.sh` fails loudly if k6 is absent.
          k6-version: "0.54.0"
      - name: "Run load gate (k6: 60s at 25 check-ins/s, p95 < 300ms)"
        run: make check-load

  build-push:
    name: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The registry gate: no green main run, no image. A failing or skipped
    # gate leaves this job un-run (AC CI (failure)).
    needs: [check-api, check-web, check-e2e, check-load]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Compute image tag
        id: meta
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          # GHCR repository names are lowercase; the owner may not be.
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The only secret this workflow touches; never echoed.
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/workpulse-api:sha-${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=workpulse-api
          cache-to: type=gha,mode=max,scope=workpulse-api
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/workpulse-web:sha-${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=workpulse-web
          cache-to: type=gha,mode=max,scope=workpulse-web
