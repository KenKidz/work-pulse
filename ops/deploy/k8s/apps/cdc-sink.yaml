# CDC projection sink worker (Phase 5, ADR 0024).
#
# Same Python image as the API, command override only (`latest` is a local
# convenience; the deploy tooling patches in sha-<commit>). It consumes the
# `workpulse.cdc.*` topics into ClickHouse and polls the Connect REST API via
# CDC_CONNECT_URL (workpulse-env). No HTTP surface: worker metrics listeners
# are disabled in-cluster (ADR 0023), so Ready means the container is running
# and the deploy smoke's full-workload wait catches a crash-loop. One replica:
# breaker state is per process (ADR 0025).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdc-sink
  namespace: workpulse
  labels:
    app.kubernetes.io/name: cdc-sink
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: workpulse
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cdc-sink
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cdc-sink
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: workpulse
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: cdc-sink
          image: workpulse-api:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - workers.cdc_sink.main
          envFrom:
            - configMapRef:
                name: workpulse-env
            - secretRef:
                name: workpulse-config
                optional: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
