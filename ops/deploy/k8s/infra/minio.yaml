# MinIO -- private employee-document bucket (Phase 4+, ADR 0022).
#
# The API uses the MinIO root credential as its S3 access/secret pair
# (STORAGE_ACCESS_KEY / STORAGE_SECRET_KEY -> MINIO_ROOT_USER/PASSWORD),
# exactly like the compose dev service. A one-shot Job creates the private
# bucket named by STORAGE_BUCKET once the server is ready.
#
# The browser-facing presigned URL host is the in-cluster `minio` name, so the
# deploy smoke does not exercise document uploads (it logs in and checks in).
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: workpulse
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: workpulse
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: workpulse
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: workpulse
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/part-of: workpulse
    spec:
      initContainers:
        # The server runs as minio (100:101); make a fresh volume root writable
        # before it starts (the compose service runs as root for this reason).
        - name: fix-permissions
          image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - chown -R 100:101 /data
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: minio
          image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
          imagePullPolicy: IfNotPresent
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          securityContext:
            runAsUser: 100
            runAsGroup: 101
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: workpulse-config
                  key: STORAGE_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: workpulse-config
                  key: STORAGE_SECRET_KEY
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /minio/health/live
              port: api
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 40
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
---
# One-shot bucket provisioning, mirroring the compose `minio-init` service.
# `mc ready` gates the create so the Job can be applied with the rest of the
# infra and retried safely; `--ignore-existing` is idempotent.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: workpulse
  labels:
    app.kubernetes.io/name: minio-init
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: workpulse
spec:
  # One-shot: delete the Job before re-applying (`mc --ignore-existing` makes
  # the bucket step idempotent). The deadline keeps an unreachable MinIO from
  # hanging the deploy proof forever.
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-init
        app.kubernetes.io/component: infra
        app.kubernetes.io/part-of: workpulse
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
      initContainers:
        - name: wait-for-minio
          image: cgr.dev/chainguard/minio-client@sha256:778b2dac231584d5d5749ab663f9f61979d60dd5c00abf682af888db6a9f46e4
          imagePullPolicy: IfNotPresent
          command:
            - /usr/bin/mc
          args:
            - ready
            - workpulse
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: workpulse-config
                  key: STORAGE_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: workpulse-config
                  key: STORAGE_SECRET_KEY
            # Order matters: Kubernetes expands $(VAR) from earlier entries.
            # STORAGE_SECRET_KEY must be URL-safe (see secret.example.yaml).
            - name: MC_HOST_workpulse
              value: "http://$(MINIO_ROOT_USER):$(MINIO_ROOT_PASSWORD)@minio:9000"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: create-bucket
          image: cgr.dev/chainguard/minio-client@sha256:778b2dac231584d5d5749ab663f9f61979d60dd5c00abf682af888db6a9f46e4
          imagePullPolicy: IfNotPresent
          command:
            - /usr/bin/mc
          args:
            - mb
            - --ignore-existing
            # Kubernetes expands $(STORAGE_BUCKET) in args from the container
            # environment, so the Job cannot drift from the app's bucket.
            - "workpulse/$(STORAGE_BUCKET)"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: workpulse-config
                  key: STORAGE_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: workpulse-config
                  key: STORAGE_SECRET_KEY
            - name: STORAGE_BUCKET
              valueFrom:
                secretKeyRef:
                  name: workpulse-config
                  key: STORAGE_BUCKET
            - name: MC_HOST_workpulse
              value: "http://$(MINIO_ROOT_USER):$(MINIO_ROOT_PASSWORD)@minio:9000"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
