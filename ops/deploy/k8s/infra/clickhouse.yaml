# ClickHouse 24.8 -- analytical projection store (Phase 4, ADR 0019).
#
# The image creates the canonical `workpulse` database and user from the
# CLICKHOUSE_* variables; the password comes from the out-of-band Secret and
# must match the CLICKHOUSE_URL used by the API and the CDC sink. The canonical
# DDL is applied best-effort by the API at boot and by the CDC sink's writer.
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: workpulse
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/part-of: workpulse
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: workpulse
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/part-of: workpulse
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse
        app.kubernetes.io/part-of: workpulse
    spec:
      initContainers:
        # The server drops to the clickhouse user (uid 101); make a fresh
        # volume root writable before the entrypoint starts.
        - name: fix-permissions
          image: clickhouse/clickhouse-server:24.8-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - chown -R 101:101 /var/lib/clickhouse
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.8-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8123
          env:
            - name: CLICKHOUSE_DB
              value: workpulse
            - name: CLICKHOUSE_USER
              value: workpulse
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: workpulse-config
                  key: CLICKHOUSE_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
