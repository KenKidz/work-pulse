# Apache Kafka 3.9.1 -- single-node KRaft event bus (Phase 3, ADR 0012).
#
# The compose topology is collapsed to the one listener in-cluster clients need:
# PLAINTEXT on :9092, advertised as `kafka:9092`. The controller listener stays
# pod-local (:9093, quorum voter `localhost`) so KRaft election never depends on
# Service endpoints existing. Storage topics are auto-created by the relay and
# Kafka Connect with replication factor 1.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: workpulse
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: workpulse
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: plaintext
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: workpulse
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: workpulse
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/part-of: workpulse
    spec:
      # The appuser (1000) image cannot write a root-created volume root; chown
      # the empty PVC before the broker starts.
      initContainers:
        - name: fix-permissions
          image: apache/kafka:3.9.1
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -c
            - chown -R 1000:1000 /var/lib/kafka/data
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: kafka
          image: apache/kafka:3.9.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: plaintext
              containerPort: 9092
          env:
            # Same cluster id as the compose dev broker: stable KRaft metadata.
            - name: CLUSTER_ID
              value: "tdRbhqiJR7-1XAqpVhXFtQ"
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_HEAP_OPTS
              value: "-Xms512m -Xmx512m"
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - "</dev/tcp/localhost/9092"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - "</dev/tcp/localhost/9092"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          startupProbe:
            exec:
              command:
                - bash
                - -c
                - "</dev/tcp/localhost/9092"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1536Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
