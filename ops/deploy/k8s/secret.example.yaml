# Placeholder for the out-of-band `workpulse-config` Secret.
#
# DO NOT APPLY THIS FILE. The deploy tooling creates the real Secret from an
# untracked values file (`make deploy-check` / `ops/deploy/README.md`, T6).
# These are placeholders; the tracked dev credentials in docker-compose.yml and
# .env.example are never reused in a deployed environment (.ai/security.md).
#
# Required boot keys (REQUIRED_BOOT_KEYS in apps/api/app/shared/boot.py; every
# app process -- API and all five workers -- receives all of them):
#   DATABASE_URL              PostgreSQL DSN for the in-cluster service
#   REDIS_URL                 Redis URL for fan-out + rate limiting
#   KAFKA_BOOTSTRAP_SERVERS   Kafka broker address
#   CLICKHOUSE_URL            ClickHouse HTTP URL (database = workpulse)
#   STORAGE_ENDPOINT          MinIO S3 endpoint (API reachable)
#   STORAGE_ACCESS_KEY        MinIO root user (also MINIO_ROOT_USER)
#   STORAGE_SECRET_KEY        MinIO root password (also MINIO_ROOT_PASSWORD)
#   STORAGE_BUCKET            Private documents bucket (documents)
#
# Additional infrastructure keys:
#   POSTGRES_PASSWORD         PostgreSQL StatefulSet password; must match
#                             DATABASE_URL
#   CLICKHOUSE_PASSWORD       ClickHouse user password; must match
#                             CLICKHOUSE_URL
#
# Generate URL-safe values: STORAGE_SECRET_KEY is embedded in the bucket-init
# Job's MC_HOST URL, and both passwords are embedded in connection URLs. Use a
# URL-safe alphabet (or percent-encode the URL forms). Never reuse `workpulse`.
#
# The CDC connector registration (T6) must use the same POSTGRES_PASSWORD: the
# in-cluster Postgres service is named `postgres` and the connector's defaults
# (`workpulse` user/database) match the StatefulSet.
apiVersion: v1
kind: Secret
metadata:
  name: workpulse-config
  namespace: workpulse
  labels:
    app.kubernetes.io/name: workpulse
    app.kubernetes.io/part-of: workpulse
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://workpulse:CHANGE_ME_POSTGRES_PASSWORD@postgres:5432/workpulse"
  REDIS_URL: "redis://redis:6379/0"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  CLICKHOUSE_URL: "http://workpulse:CHANGE_ME_CLICKHOUSE_PASSWORD@clickhouse:8123/workpulse"
  STORAGE_ENDPOINT: "http://minio:9000"
  STORAGE_ACCESS_KEY: "CHANGE_ME_MINIO_ACCESS_KEY"
  STORAGE_SECRET_KEY: "CHANGE_ME_URL_SAFE_MINIO_SECRET"
  STORAGE_BUCKET: "documents"
  POSTGRES_PASSWORD: "CHANGE_ME_POSTGRES_PASSWORD"
  CLICKHOUSE_PASSWORD: "CHANGE_ME_CLICKHOUSE_PASSWORD"
