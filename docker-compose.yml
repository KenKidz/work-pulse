# Local development infrastructure (PostgreSQL + Phase-2 Redis + Phase-3 Kafka
# + Phase-4 ClickHouse + Phase-4+ MinIO object storage). The apps run natively
# via `make dev-api` / `make dev-web` — see the Makefile.

services:
  postgres:
    image: postgres:16
    # Logical WAL for the Phase-5 Debezium connector (`make cdc-up`). Bound
    # retention so a stopped connector cannot fill the volume; exceeding it
    # invalidates the slot and requires a re-snapshot (ops/cdc/README.md).
    command:
      [
        "postgres",
        "-c",
        "wal_level=logical",
        "-c",
        "max_slot_wal_keep_size=1GB",
      ]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-workpulse} -d ${POSTGRES_DB:-workpulse}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-test:
    image: postgres:16
    command:
      [
        "postgres",
        "-c",
        "wal_level=logical",
        "-c",
        "max_slot_wal_keep_size=1GB",
      ]
    environment:
      POSTGRES_USER: workpulse
      POSTGRES_PASSWORD: workpulse
      POSTGRES_DB: workpulse_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workpulse -d workpulse_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # Loopback only: the apps run natively on the host, and an
      # unauthenticated Redis must never be reachable from the network.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-test:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Phase 3: event transport (`make kafka-up`, ADR 0012) ---
  # Single-node KRaft broker; the outbox relay publishes `workpulse.events`
  # keyed by `data.employee_id`. Loopback only: the relay runs natively on
  # the host, and v1 has no auth on the bus.

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      # Explicit single-node KRaft settings (image defaults mirrored, so an
      # image bump cannot silently move ports/roles).
      CLUSTER_ID: tdRbhqiJR7-1XAqpVhXFtQ
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL is the container-network listener (Kafka Connect, `kafka:29092`);
      # host clients keep `localhost:9092` for the API/workers/tests.
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # Bash TCP probe of the PLAINTEXT listener: a JVM CLI probe every 5s
      # would keep booting a JVM for the container's whole lifetime; /dev/tcp
      # exits 0 as soon as the broker accepts connections.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9092'"]
      interval: 5s
      timeout: 3s
      retries: 30

  kafka-test:
    image: apache/kafka:3.9.1
    ports:
      # Same port in and out of the container: the advertised
      # `localhost:9093` is then correct for host-side tests AND for
      # in-container clients (the healthcheck). The controller moves to a
      # private port so it cannot collide with the broker's.
      - "127.0.0.1:9093:9093"
    environment:
      CLUSTER_ID: gqyPCL89QVOEcQ-Kuoj7Ww
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # See `kafka`: `localhost:9093` for host clients, `kafka-test:29093` for
      # the test Connect worker.
      KAFKA_LISTENERS: PLAINTEXT://:9093,INTERNAL://:29093,CONTROLLER://:19093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9093,INTERNAL://kafka-test:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:19093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    tmpfs:
      # tmpfs mounts default to root ownership; the image runs as appuser (1000).
      - /var/lib/kafka/data:uid=1000,gid=1000
    healthcheck:
      # See `kafka` — same TCP probe, on this service's PLAINTEXT port.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9093'"]
      interval: 5s
      timeout: 3s
      retries: 30

  # --- Phase 5: CDC capture (`make cdc-up`, ADR 0024) ---
  # Debezium Kafka Connect (distributed mode). Connector/offset/status state
  # lives in compacted Kafka topics, so there is no data volume to keep. The
  # REST API is loopback-only; `ops/cdc/register.sh` seeds the readiness fence
  # and registers the Postgres connector. The image is pinned (Debezium
  # 3.2.4.Final) so connector wire encodings cannot drift with a floating tag.

  kafka-connect:
    image: quay.io/debezium/connect:3.2.4.Final
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: workpulse-cdc-connect
      CONFIG_STORAGE_TOPIC: workpulse.cdc.connect.configs
      OFFSET_STORAGE_TOPIC: workpulse.cdc.connect.offsets
      STATUS_STORAGE_TOPIC: workpulse.cdc.connect.status
      # Single-node broker: Connect's default replication factor of 3 would
      # fail topic creation. The entrypoint maps CONNECT_* envs to worker
      # properties.
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8083'"]
      interval: 5s
      timeout: 3s
      retries: 30

  kafka-connect-test:
    image: quay.io/debezium/connect:3.2.4.Final
    ports:
      - "127.0.0.1:8084:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka-test:29093
      GROUP_ID: workpulse-cdc-connect-test
      CONFIG_STORAGE_TOPIC: workpulse.cdc.connect.configs
      OFFSET_STORAGE_TOPIC: workpulse.cdc.connect.offsets
      STATUS_STORAGE_TOPIC: workpulse.cdc.connect.status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    depends_on:
      kafka-test:
        condition: service_healthy
    tmpfs:
      # Connect writes little locally (state is in Kafka), but keep the
      # throwaway instance off the host disk. Debezium's image runs as the
      # `kafka` user (uid/gid 1001).
      - /kafka/data:uid=1001,gid=1001
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8083'"]
      interval: 5s
      timeout: 3s
      retries: 30

  # --- Phase 4: analytical projection (`make clickhouse-up`, ADR 0019) ---
  # ClickHouse speaks HTTP on :8123; `clickhouse-connect` from the API and the
  # reports worker are its only clients. Loopback only, like Redis/Kafka: the
  # fixed dev credential never leaves the host, and v1 adds no broker auth.

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    ports:
      - "127.0.0.1:8123:8123"
    environment:
      # Created on first boot; the projection DDL runs in this database. The
      # image's `default` user is loopback-only inside the container, so the
      # API/worker use this fixed dev user instead.
      CLICKHOUSE_DB: workpulse
      CLICKHOUSE_USER: workpulse
      CLICKHOUSE_PASSWORD: workpulse
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      # `/ping` answers `Ok.`; it is the server's own liveness endpoint.
      test:
        [
          "CMD-SHELL",
          "wget -qO- --timeout=2 http://127.0.0.1:8123/ping | grep -q Ok",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse-test:
    image: clickhouse/clickhouse-server:24.8-alpine
    ports:
      - "127.0.0.1:8124:8123"
    environment:
      CLICKHOUSE_DB: workpulse_test
      CLICKHOUSE_USER: workpulse
      CLICKHOUSE_PASSWORD: workpulse
    tmpfs:
      # The image runs as `clickhouse` (uid/gid 101); keep its data dir
      # writable without an entrypoint chown on every boot.
      - /var/lib/clickhouse:uid=101,gid=101
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- --timeout=2 http://127.0.0.1:8123/ping | grep -q Ok",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Phase 4+: employee documents object storage (`make minio-up`, ADR 0022)
  # Private S3-compatible bucket; the API returns presigned URLs only. MinIO
  # stopped publishing community images in Oct 2025, so this pins the
  # `alpine/minio` mirror of the last community release (upstream MinIO at that
  # tag). Root is used only to make a fresh named/tmpfs volume writable; the
  # stores are loopback-only and never leave the host.

  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    user: "0:0"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: workpulse
      MINIO_ROOT_PASSWORD: workpulse
      # The web dev origin may POST/GET presigned URLs directly (ADR 0022).
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- --timeout=2 http://127.0.0.1:9000/minio/health/live",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-test:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    user: "0:0"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: workpulse
      MINIO_ROOT_PASSWORD: workpulse
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    tmpfs:
      - /data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- --timeout=2 http://127.0.0.1:9000/minio/health/live",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot bucket provisioning (private by default — `mc mb` adds no
  # anonymous policy). The official `minio/mc` image is gone too, so these use
  # Chainguard's digest-pinned `minio-client` (the `mc` binary).
  # `docker compose run --rm <service>` is how the Makefile waits for it.
  minio-init:
    image: cgr.dev/chainguard/minio-client@sha256:778b2dac231584d5d5749ab663f9f61979d60dd5c00abf682af888db6a9f46e4
    entrypoint: ["/usr/bin/mc"]
    environment:
      MC_HOST_dev: http://workpulse:workpulse@minio:9000
    command: ["mb", "--ignore-existing", "dev/documents"]
    depends_on:
      minio:
        condition: service_healthy

  minio-test-init:
    image: cgr.dev/chainguard/minio-client@sha256:778b2dac231584d5d5749ab663f9f61979d60dd5c00abf682af888db6a9f46e4
    entrypoint: ["/usr/bin/mc"]
    environment:
      MC_HOST_test: http://workpulse:workpulse@minio-test:9000
    command: ["mb", "--ignore-existing", "test/documents-test"]
    depends_on:
      minio-test:
        condition: service_healthy

  # --- Phase 6: observability (`make observability-up`, ADR 0023) ---
  # Prometheus scrapes the API (:8000/metrics) and the six loopback worker
  # listeners (:9101–:9106) through Docker's host gateway because the apps run
  # natively on the host. Grafana provisions its Prometheus datasource and the
  # WorkPulse overview dashboard from version-controlled JSON under
  # `ops/observability/`. Both bind to host loopback like the other infra; no
  # otel-collector, Tempo or Jaeger service is part of this stack.

  prometheus:
    image: prom/prometheus:v3.0.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.listen-address=0.0.0.0:9090"
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      # Resolves the host from inside the container on Linux; Docker Desktop
      # already provides it on macOS/Windows.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./ops/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- --timeout=2 http://127.0.0.1:9090/-/healthy >/dev/null",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:11.4.0
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      # Local dev only: anonymous Viewer so `make observability-up` needs no
      # login, while the admin account still exists for ad-hoc work.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- --timeout=2 http://127.0.0.1:3000/api/health >/dev/null",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  kafka-data:
  clickhouse-data:
  minio-data:
  prometheus-data:
  grafana-data:
